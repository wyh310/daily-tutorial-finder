name: backfill-duration

# 一次性回填 B站视频时长并清理低于3分钟的选题。手动触发，不定时运行。
# 想只删除不回填时，可改用 prune-short-videos 工作流（更快）。
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Backfill duration & cleanup short videos
        env:
          PYTHONUNBUFFERED: '1'
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: python cleanup_short.py
